[project]
name = "drone-detect"
version = "0.1.0"
description = "Close-range drone detection — host-side training/quantization pipeline (YOLOv5n → Brevitas QAT → QONNX)"
readme = "drone_detection_project_brief.md"
requires-python = ">=3.11,<3.12"

dependencies = [
    # --- core DL / quantization ---
    "torch==2.4.1",
    "torchvision==0.19.1",
    "brevitas>=0.11.0",
    "qonnx>=0.4.0",
    "onnx>=1.16.0",
    "onnxruntime>=1.18.0",
    # --- data / augmentation ---
    "numpy>=1.24,<2",
    "opencv-python>=4.9.0",
    "pillow>=10.0.0",
    "albumentations>=1.4.0",
    "pyyaml>=6.0",
    # --- YOLOv5 (classic repo) runtime needs ---
    "pandas>=2.0.0",
    "scipy>=1.11.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.13.0",
    "tqdm>=4.66.0",
    "thop>=0.1.1",
    "psutil>=5.9.0",
    "requests>=2.31.0",
    "tensorboard>=2.15.0",
    # --- dataset acquisition ---
    "kaggle>=1.6.0",
    "gitpython>=3.1.52",
    "ipython>=9.15.0",
    "imagehash>=4.3.2",
    "jupyterlab>=4.6.1",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.8",
    "wandb>=0.28.1",
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
