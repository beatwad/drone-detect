# Kernel options for a USB 3.0 UVC camera on the ZCU102.
#
# PHY_XILINX_ZYNQMP is the one that bites: without the PS-GTR PHY driver the
# SuperSpeed lane never trains and the port degrades to USB 2.0 with no error
# message. Check with `lsusb -t` -- it must report 5000M, not 480M.
CONFIG_PHY_XILINX_ZYNQMP=y
CONFIG_USB_DWC3=y
# DUAL_ROLE, not HOST. Xilinx's 5.15 dwc3 calls dwc3_gadget_exit_hibernation()
# from core.c without guarding it on the gadget being built, so a host-only
# kernel fails to link vmlinux:
#   drivers/usb/dwc3/core.c:1829: undefined reference to
#   `dwc3_gadget_exit_hibernation'
# Dual-role builds both halves and costs nothing here -- the role is chosen at
# runtime by dr_mode = "host" in system-user.dtsi.
CONFIG_USB_DWC3_DUAL_ROLE=y
CONFIG_USB_XHCI_HCD=y
CONFIG_USB_XHCI_PLATFORM=y
# UVC: the camera is a standard USB Video Class device, no vendor driver.
CONFIG_MEDIA_SUPPORT=y
CONFIG_MEDIA_USB_SUPPORT=y
CONFIG_MEDIA_CAMERA_SUPPORT=y
CONFIG_USB_VIDEO_CLASS=y
CONFIG_USB_VIDEO_CLASS_INPUT_EVDEV=y
