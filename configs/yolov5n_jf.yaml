# yolov5n-jf: multi-scale detection with ZERO joins. The FINN-proof candidate.
#
# n_eighth (configs/yolov5n_eighth.yaml) beats pico on every regime but carries
# 20 joins, so it only exists if FINN compiles branched graphs. This asks the
# question that makes that test irrelevant: how much of n_eighth's gain comes
# from having THREE HEADS (a fork -- FINN has DuplicateStreams_Batch) rather than
# from the FPN's cross-scale FUSION (a join -- the thing that may not compile)?
#
# All four join sources removed:
#   7 Add  Bottleneck residuals       -> no C3 at all              (was free)
#   8 Cat  C3 internal concat         -> plain 3x3 Conv stacks     (costs params)
#   1 Cat  SPPF                       -> deleted                   (saves 41k)
#   4 Cat  FPN/PAN neck               -> heads tap the backbone    (saves 180k)
#
# What survives is forks only: the backbone splits three ways at P3/P4/P5 and
# each branch runs its own head. Forks are cheap for FINN; joins are not.
#
# DELIBERATELY OVERSIZED vs n_eighth: 484,774 params / 337 MMAC against 446,182 /
# 248. Plain convs cost more than C3's bottleneck (the same effect that made
# pico's C3->Conv swap ADD 297k params). That is a feature here -- if this
# underperforms n_eighth there is no capacity excuse, the difference is topology.
#
# Taps: layer 5 (P3/8), layer 8 (P4/16), layer 10 (P5/32).
#
# Target W8A8 -- measured free three times, and 4-bit is worst on narrow nets.
# W8A8 footprint 7.8 Mbit with FINN's x2 packing, and unlike n_eighth there are
# no skip FIFOs to pay on top, so this estimate should hold.

nc: 1
depth_multiple: 0.33
width_multiple: 0.125
activation: nn.ReLU()

anchors:
  - [10, 13, 16, 30, 33, 23] # P3/8
  - [30, 61, 62, 45, 59, 119] # P4/16
  - [116, 90, 156, 198, 373, 326] # P5/32

backbone:
  # [from, number, module, args]
  [[-1, 1, Conv, [64, 6, 2, 2]], # 0-P1/2   208
   [-1, 1, Conv, [128, 3, 2]], # 1-P2/4   104
   [-1, 1, Conv, [128, 3, 1]], # 2
   [-1, 1, Conv, [256, 3, 2]], # 3-P3/8    52
   [-1, 1, Conv, [256, 3, 1]], # 4
   [-1, 1, Conv, [256, 3, 1]], # 5        <-- P3 tap
   [-1, 1, Conv, [512, 3, 2]], # 6-P4/16   26
   [-1, 1, Conv, [512, 3, 1]], # 7
   [-1, 1, Conv, [512, 3, 1]], # 8        <-- P4 tap
   [-1, 1, Conv, [1024, 3, 2]], # 9-P5/32  13
   [-1, 1, Conv, [1024, 3, 1]], # 10       <-- P5 tap
  ]

head:
  [[5, 1, Conv, [256, 1, 1]], # 11  P3 branch
   [-1, 1, Conv, [384, 3, 1]], # 12
   [8, 1, Conv, [512, 1, 1]], # 13  P4 branch
   [-1, 1, Conv, [768, 3, 1]], # 14
   [10, 1, Conv, [512, 1, 1]], # 15  P5 branch
   [-1, 1, Conv, [768, 3, 1]], # 16
   [[12, 14, 16], 1, Detect, [nc, anchors]], # 17  Detect(P3, P4, P5)
  ]
