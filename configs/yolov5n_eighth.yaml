# yolov5n-eighth: stock yolov5n at width_multiple 0.125 instead of 0.25.
#
# The ablation (yolov5n -> pico) showed the width cut did 76% of the parameter
# reduction and every other change was either forced by FINN's join limitation or
# actively counterproductive -- C3 -> plain Conv COST 297k params. So if FINN
# turns out to compile joins, the right small model is not pico: it is stock
# yolov5n narrowed and otherwise untouched.
#
#   yolov5n @ 0.25 : 1,765,270 params   892 MMAC@416
#   yolov5n @ 0.125:   446,182 params   248 MMAC@416   <-- this file
#   pico           :   358,170 params   148 MMAC@416
#
# 88k params (25%) more than pico, and it buys back the ENTIRE architecture:
# 3 detection heads, the FPN/PAN neck, C3's bottleneck efficiency, SPPF. pico's
# measured weakness is long range (0.778 vs yolov5n's 0.904) and that is exactly
# what the multi-scale heads address.
#
# TARGET W8A8, NOT W4A8. Measured on pico: W8A8 calibration beat W4A8 QAT on
# every regime with zero training, because per-tensor 4-bit has only 16 levels
# and narrow layers have no redundancy to absorb a full-step weight flip. 4-bit
# is most needed exactly where it works worst. At W8A8 this is 7.1 Mbit with
# FINN's x2 packing -- 22% of a ZCU102, and at the "ports to anything in the
# class" threshold for the eventual deployment part.
#
# CAVEAT: that 7.1 Mbit counts weights only. Unlike pico, this net has skips, and
# in FINN a skip needs a FIFO deep enough to hold a feature map while the other
# branch computes -- BRAM that pico does not pay. The P3 skip is the expensive
# one. Real footprint will land above 7.1 Mbit, possibly well above.
#
# Trained from scratch (COCO weights do not transfer -- every channel count
# differs), 416 px, same hyp/epochs/seed as pico for a clean comparison.
#
# CONDITIONAL ON THE FINN JOIN TEST. 13 Concats + 7 Adds, same topology as stock
# yolov5n. If FINN cannot compile joins this model is unusable and pico stands.

nc: 1
depth_multiple: 0.33
width_multiple: 0.125
activation: nn.ReLU()

anchors:
  - [10, 13, 16, 30, 33, 23] # P3/8
  - [30, 61, 62, 45, 59, 119] # P4/16
  - [116, 90, 156, 198, 373, 326] # P5/32

backbone:
  # [from, number, module, args]
  [[-1, 1, Conv, [64, 6, 2, 2]], # 0-P1/2
   [-1, 1, Conv, [128, 3, 2]], # 1-P2/4
   [-1, 3, C3, [128]],
   [-1, 1, Conv, [256, 3, 2]], # 3-P3/8
   [-1, 6, C3, [256]],
   [-1, 1, Conv, [512, 3, 2]], # 5-P4/16
   [-1, 9, C3, [512]],
   [-1, 1, Conv, [1024, 3, 2]], # 7-P5/32
   [-1, 3, C3, [1024]],
   [-1, 1, SPPF, [1024, 5]], # 9
  ]

head:
  [[-1, 1, Conv, [512, 1, 1]],
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],
   [[-1, 6], 1, Concat, [1]], # cat backbone P4
   [-1, 3, C3, [512, False]], # 13

   [-1, 1, Conv, [256, 1, 1]],
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],
   [[-1, 4], 1, Concat, [1]], # cat backbone P3
   [-1, 3, C3, [256, False]], # 17 (P3/8-small)

   [-1, 1, Conv, [256, 3, 2]],
   [[-1, 14], 1, Concat, [1]], # cat head P4
   [-1, 3, C3, [512, False]], # 20 (P4/16-medium)

   [-1, 1, Conv, [512, 3, 2]],
   [[-1, 10], 1, Concat, [1]], # cat head P5
   [-1, 3, C3, [1024, False]], # 23 (P5/32-large)

   [[17, 20, 23], 1, Detect, [nc, anchors]], # Detect(P3, P4, P5)
  ]
